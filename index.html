<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-ART | Advanced Intro Experience</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --accent: #a855f7;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Subtle Logo Watermark (Resized & Balanced) */
        .bg-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(40vw, 300px);
            height: min(40vw, 300px);
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-watermark img, .bg-watermark i {
            width: 100%;
            height: 100%;
            object-fit: contain;
            font-size: 250px;
            color: var(--text-main);
        }

        /* Top Bar & Controls */
        header {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-mini {
            font-weight: 900;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .lang-switcher {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .lang-switcher:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2;
            text-align: center;
        }

        /* Intro Text Animation Box */
        .intro-text-box {
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1s forwards 0.3s;
        }

        .intro-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .intro-subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Realistic Camera Lens Hub */
        .camera-hub {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 30px;
        }

        /* Outer Glow Rings */
        .lens-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(99, 102, 241, 0.3);
            animation: rotateSlow 20s linear infinite;
        }

        .lens-ring.r1 { width: 100%; height: 100%; }
        .lens-ring.r2 { width: 85%; height: 85%; border-color: rgba(168, 85, 247, 0.4); animation-direction: reverse; animation-duration: 15s; }

        /* Realistic Camera Lens Body */
        .camera-body {
            position: relative;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #1e293b 0%, #090d16 80%);
            border-radius: 50%;
            border: 4px solid #334155;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.9), 0 0 20px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .camera-hub:hover .camera-body {
            transform: scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 0 40px var(--primary-glow), inset 0 0 25px rgba(0,0,0,0.9);
        }

        /* Camera Glass Refraction & Blades */
        .camera-glass {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3b82f6 0%, #1e1b4b 50%, #020617 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(59, 130, 246, 0.6);
        }

        .camera-glass::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
            transform: rotate(25deg);
            pointer-events: none;
        }

        .lens-icon {
            font-size: 2rem;
            color: #ffffff;
            z-index: 2;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: var(--transition);
        }

        .camera-hub:hover .lens-icon {
            transform: scale(1.1) rotate(15deg);
            color: #93c5fd;
        }

        /* Active Recording State */
        .camera-hub.recording .camera-body {
            border-color: #ef4444;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.6), inset 0 0 20px rgba(0,0,0,0.9);
            animation: pulseRecord 1.5s infinite;
        }

        .camera-hub.recording .camera-glass {
            background: radial-gradient(circle at 30% 30%, #991b1b 0%, #450a0a 50%, #020617 100%);
        }

        /* Action Status Text */
        .status-badge {
            margin-top: 15px;
            padding: 8px 20px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        /* Footer & Copyrights */
        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        footer span {
            color: var(--primary);
            font-weight: 600;
        }

        /* Animations */
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseRecord {
            0% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 50px rgba(239, 68, 68, 0.8); }
            100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        }
    </style>
</head>
<body>

    <!-- Background Watermark Logo -->
    <div class="bg-watermark">
        <i class="fa-solid fa-cube"></i>
    </div>

    <!-- Header / Nav -->
    <header>
        <div class="brand-mini">K-ART</div>
        <button class="lang-switcher" id="langToggle" onclick="toggleLanguage()">English</button>
    </header>

    <!-- Main Content Area -->
    <div class="main-container">
        
        <!-- Intro Header Text -->
        <div class="intro-text-box">
            <h1 class="intro-title" id="mainTitle">تجربة إبداعية متكاملة</h1>
            <p class="intro-subtitle" id="mainSubtitle">اضغط على العدسة أدناه لبدء التفاعل والعرض المباشر</p>
        </div>

        <!-- Realistic Camera Hub Component -->
        <div class="camera-hub" id="cameraHub" onclick="toggleCameraAction()">
            <div class="lens-ring r1"></div>
            <div class="lens-ring r2"></div>
            <div class="camera-body">
                <div class="camera-glass">
                    <i class="fa-solid fa-camera-retro lens-icon" id="lensIcon"></i>
                </div>
            </div>
        </div>

        <!-- Status Dynamic Badge -->
        <div class="status-badge" id="statusBadge">جاهز للتفعيل والاستعراض</div>

    </div>

    <!-- Footer Copyrights -->
    <footer>
        <div id="footerText">© 2026 K-ART. All Rights Reserved. | Powered By <span>Mostafa El-Sayed</span></div>
    </footer>

    <!-- JavaScript Control Logic -->
    <script>
        let currentLang = 'ar';
        let isRecording = false;

        const translations = {
            ar: {
                title: "تجربة إبداعية متكاملة",
                subtitle: "اضغط على العدسة أدناه لبدء التفاعل والعرض المباشر",
                statusReady: "جاهز للتفعيل والاستعراض",
                statusActive: "جاري تشغيل العدسة والتسجيل التفاعلي...",
                langBtn: "English",
                dir: "rtl"
            },
            en: {
                title: "Immersive Creative Experience",
                subtitle: "Click the lens below to initialize interactive mode",
                statusReady: "Ready for Activation & Preview",
                statusActive: "Optics Active & Recording Live...",
                langBtn: "العربية",
                dir: "ltr"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const t = translations[currentLang];
            
            // Update Document Direction and Lang
            document.getElementById('htmlRoot').setAttribute('dir', t.dir);
            document.getElementById('htmlRoot').setAttribute('lang', currentLang);

            // Update Texts
            document.getElementById('mainTitle').innerText = t.title;
            document.getElementById('mainSubtitle').innerText = t.subtitle;
            document.getElementById('langToggle').innerText = t.langBtn;
            document.getElementById('statusBadge').innerText = isRecording ? t.statusActive : t.statusReady;
        }

        function toggleCameraAction() {
            const hub = document.getElementById('cameraHub');
            const badge = document.getElementById('statusBadge');
            const icon = document.getElementById('lensIcon');
            const t = translations[currentLang];

            isRecording = !isRecording;

            if (isRecording) {
                hub.classList.add('recording');
                badge.innerText = t.statusActive;
                badge.style.borderColor = '#ef4444';
                badge.style.color = '#fca5a5';
                icon.className = "fa-solid fa-circle-dot lens-icon";
            } else {
                hub.classList.remove('recording');
                badge.innerText = t.statusReady;
                badge.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                badge.style.color = 'var(--text-muted)';
                icon.className = "fa-solid fa-camera-retro lens-icon";
            }
        }
    </script>
</body>
</html>
